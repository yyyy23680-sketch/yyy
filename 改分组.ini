custom_proxy_group=🇸🇬 新加坡节点`url-test`(?=.*(新加坡|新坡|沪坡|深坡|狮城|SG|Singapore|🇸🇬))^((?!(游戏|剩余|流量|2.0|2倍|2x|3.0|3倍|3x|4.0|4倍|4x)).)*$`https://www.gstatic.com/generate_204`300,,50
