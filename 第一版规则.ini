custom_proxy_group=🌍 其余节点`url-test`^((?!(美国|美西|美东|波特兰|达拉斯|俄勒冈|凤凰城|费利蒙|硅谷|拉斯维加斯|洛杉矶|圣何塞|圣克拉拉|西雅图|芝加哥|US|United States|🇺🇸|🇺🇲|新加坡|新坡|沪坡|深坡|狮城|SG|Singapore|🇸🇬|台湾|台北|TW|Taiwan|中华电信|HiNet|🇹🇼|香港|HK|Hong Kong|🇭🇰|HongKong|日本|川日|东京|大阪|泉日|埼玉|沪日|深日|JP|Japan|🇯🇵|澳大利亚|澳洲|悉尼|AU|Australia|🇦🇺|德国|法兰克福|DE|Germany|🇩🇪|法国|巴黎|FR|France|🇫🇷|到期|流量|套餐|官网|剩余|过滤|请看网站公告|状态|账户欠费)).)*$`https://www.gstatic.com/generate_204`300,,50

enable_rule_generator=true
